upstream hddap_app {
    server hddap-nginx:80;
}

# HTTP — redirect ke HTTPS (+ acme challenge untuk renew certbot)
server {
    listen 80;
    server_name hddap.cloud www.hddap.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hddap.cloud$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name hddap.cloud www.hddap.cloud;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://hddap_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}

# Redirect www → non-www (HTTPS)
server {
    listen 443 ssl http2;
    server_name www.hddap.cloud;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    return 301 https://hddap.cloud$request_uri;
}
